services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tafsil-backend:latest
    container_name: tafsil-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
