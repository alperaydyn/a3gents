# tafsil.net — API Reverse Proxy (Nginx)
# Dosya: /etc/nginx/sites-available/api.tafsil.net.conf
# Kurulum: sudo ln -sf /etc/nginx/sites-available/api.tafsil.net.conf /etc/nginx/sites-enabled/

# Rate limiting zone tanımları
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_llm:10m rate=10r/m;

# Upstream — PM2 cluster mode (2 worker)
upstream tafsil_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.tafsil.net;

    # HTTP → HTTPS yönlendirmesi (Cloudflare Proxied modda opsiyonel)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.tafsil.net;

    # ─── SSL Sertifikaları ────────────────────────────────
    # Cloudflare Origin CA sertifikası (Cloudflare Proxied mod için)
    ssl_certificate /opt/tafsil/ssl/origin-cert.pem;
    ssl_certificate_key /opt/tafsil/ssl/origin-key.pem;

    # SSL güvenlik ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Güvenlik Başlıkları ──────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip Sıkıştırma ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/event-stream;

    # ─── İstek Boyutu Limiti ──────────────────────────────
    client_max_body_size 10M;

    # ─── Genel API Proxy ──────────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://tafsil_api;
        proxy_http_version 1.1;

        # Proxy başlıkları
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Zaman aşımları
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ─── LLM / Agentic RAG Endpoint'leri (SSE Desteği) ───
    location ~ ^/api/v1/anlama-oturumlari/.+/soru$ {
        limit_req zone=api_llm burst=5 nodelay;

        proxy_pass http://tafsil_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (Server-Sent Events) için buffering kapatılır
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # LLM yanıtları uzun sürebilir
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ─── Health Check ─────────────────────────────────────
    location /health {
        proxy_pass http://tafsil_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Rate limiting uygulanmaz
        access_log off;
    }

    # ─── Statik Ses Dosyaları (Nginx Doğrudan Servis) ────
    location /audio/ {
        alias /opt/tafsil/audio/;

        # Önbellekleme: Ses dosyaları değişmez
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        # MIME tipleri
        types {
            audio/aac aac;
            audio/ogg ogg;
            audio/opus opus;
            audio/mpeg mp3;
        }

        # Byte-range desteği (ses atlama için gerekli)
        add_header Accept-Ranges bytes;
    }

    # ─── Favicon ve robots.txt ────────────────────────────
    location = /favicon.ico { return 204; access_log off; }
    location = /robots.txt  { return 200 "User-agent: *\nDisallow: /\n"; access_log off; }
}
