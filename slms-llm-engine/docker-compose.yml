name: slms-llm-engine

services:
  engine:
    build: .
    image: slms-llm-engine:latest
    container_name: slms-llm-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
    networks:
      - default
      - shared-network

networks:
  default:
  shared-network:
    external: true
