<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Gartner Sessions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      letter-spacing: -.01em;
    }
    .login-logo svg { color: var(--accent); }
    .login-heading {
      text-align: center;
    }
    .login-heading h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .login-heading p {
      font-size: 0.825rem;
      color: var(--muted);
    }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, border-color .15s, box-shadow .15s;
    }
    .btn-google:hover {
      background: var(--surface2);
      border-color: var(--border2);
      box-shadow: var(--shadow-sm);
    }
    .btn-google svg { flex-shrink: 0; }
    .login-error {
      width: 100%;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 0.8rem;
      text-align: center;
    }
    .login-divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }
    .login-footer {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Gartner Sessions
    </div>

    <div class="login-heading">
      <h1>Welcome back</h1>
      <p>Sign in to access your session library</p>
    </div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <a href="{{ url_for('auth_google') }}" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <div class="login-divider"></div>

    <p class="login-footer">Access is restricted to authorized accounts only.</p>
  </div>
</div>
</body>
</html>
