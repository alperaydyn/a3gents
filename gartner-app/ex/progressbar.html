<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Segmented Progress Bar Visible</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 32px;
            background: #111;
            color: #fff;
        }

        .wrapper {
            width: 760px;
        }

        .progress {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-bottom: 12px;
        }

        .segment {
            flex: 1;
            height: 14px;
            background: #4b4b4b;
            border: 1px solid #7a7a7a;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .fill {
            height: 100%;
            width: 0%;
            background: #ff2a2a;
            border-radius: 999px;
            box-shadow: 0 0 8px rgba(255, 42, 42, 0.35);
            transition: width 120ms linear;
        }

        .labels {
            display: flex;
            gap: 8px;
            width: 100%;
            font-size: 13px;
            color: #e0e0e0;
        }

        .labels span {
            flex: 1;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="progress" id="progress"></div>
        <div class="labels">
            <span>Intro</span>
            <span>Setup</span>
            <span>Demo</span>
            <span>Review</span>
            <span>End</span>
        </div>
    </div>

    <script>
        const sections = [4, 6, 5, 3, 2];
        const progressEl = document.getElementById('progress');
        const fills = [];

        sections.forEach(() => {
            const segment = document.createElement('div');
            segment.className = 'segment';

            const fill = document.createElement('div');
            fill.className = 'fill';

            segment.appendChild(fill);
            progressEl.appendChild(segment);
            fills.push(fill);
        });

        const totalDuration = sections.reduce((a, b) => a + b, 0);
        let currentTime = 0;

        function render() {
            let elapsed = currentTime;

            sections.forEach((sectionDuration, index) => {
                const fill = fills[index];

                if (elapsed <= 0) {
                    fill.style.width = '0%';
                } else if (elapsed >= sectionDuration) {
                    fill.style.width = '100%';
                } else {
                    fill.style.width = ((elapsed / sectionDuration) * 100) + '%';
                }

                elapsed -= sectionDuration;
            });
        }

        setInterval(() => {
            currentTime += 0.1;
            if (currentTime > totalDuration) currentTime = totalDuration;
            render();
        }, 100);

        render();
    </script>
</body>

</html>
