<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahibinden Scraper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #16161a;
      --surface-2: #1e1e24;
      --border: #2a2a32;
      --border-active: #4a4a5a;
      --text: #e8e6e3;
      --text-muted: #7f7f8a;
      --accent: #e8a838;
      --accent-dim: #e8a83820;
      --green: #4ade80;
      --red: #f87171;
      --blue: #60a5fa;
      --radius: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────── */
    .header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header h1 span {
      color: var(--accent);
    }

    .header .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 3px 10px;
      background: var(--accent-dim);
      color: var(--accent);
      border-radius: 20px;
      border: 1px solid var(--accent);
    }

    /* ── Layout ──────────────────────────────────────────── */
    .main {
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: auto 1fr;
      height: calc(100vh - 65px);
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      grid-row: 1 / -1;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .url-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input:focus {
      border-color: var(--accent);
    }

    textarea.url-input {
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      border-color: var(--border-active);
      background: var(--border);
    }

    .btn.primary {
      background: var(--accent);
      color: #0c0c0e;
      border-color: var(--accent);
    }

    .btn.primary:hover {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Tabs ─────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab:first-child {
      border-radius: var(--radius) 0 0 var(--radius);
    }

    .tab:last-child {
      border-radius: 0 var(--radius) var(--radius) 0;
    }

    .tab.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border-active);
    }

    /* ── Results list ────────────────────────────────────── */
    .results-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
    }

    .result-card {
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .result-card:hover {
      border-color: var(--accent);
    }

    .result-card .rc-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-card .rc-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .result-card .rc-price {
      color: var(--green);
      font-weight: 600;
      font-size: 13px;
      margin-top: 6px;
    }

    .results-actions {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    /* ── Browser viewport ────────────────────────────────── */
    .viewport-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewport-toolbar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
    }

    .viewport-toolbar .url-display {
      flex: 1;
      padding: 6px 12px;
      background: var(--surface-2);
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .status-dot.connected {
      background: var(--green);
    }

    .status-dot.captcha {
      background: var(--red);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .viewport-container {
      flex: 1;
      overflow: auto;
      background: #000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px;
    }

    #browserCanvas {
      border-radius: 6px;
      cursor: crosshair;
      max-width: 100%;
      height: auto;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    .viewport-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 12px;
      font-size: 14px;
    }

    .viewport-placeholder svg {
      opacity: 0.3;
    }

    /* ── Status bar ──────────────────────────────────────── */
    .statusbar {
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .statusbar .msg {
      flex: 1;
    }

    .statusbar .msg.warn {
      color: var(--red);
    }

    .statusbar .msg.ok {
      color: var(--green);
    }

    /* ── Detail modal ────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 680px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px;
    }

    .modal h2 {
      font-size: 16px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal .detail-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 6px 16px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .modal .detail-grid .label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .modal .desc {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      padding: 12px;
      background: var(--surface-2);
      border-radius: var(--radius);
    }

    .modal .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .modal .images-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 8px;
    }

    .modal .images-row img {
      height: 80px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* ── Misc ─────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .count-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      margin-left: 6px;
    }
  </style>
</head>

<body>

  <!-- ── Header ────────────────────────────────────────────── -->
  <div class="header">
    <h1>Sahibinden <span>Scraper</span></h1>
    <div class="badge">human-in-the-loop</div>
  </div>

  <!-- ── Main layout ───────────────────────────────────────── -->
  <div class="main">

    <!-- ── Sidebar ───────────────────────────────────────── -->
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Input</h3>
        <div class="tabs">
          <div class="tab active" data-tab="single" onclick="switchTab('single')">Single URL</div>
          <div class="tab" data-tab="batch" onclick="switchTab('batch')">Batch</div>
        </div>
        <div id="singleTab">
          <input class="url-input" id="urlInput" type="url" placeholder="https://www.sahibinden.com/ilan/..."
            value="https://www.sahibinden.com/ilan/emlak-konut-satilik-sahibinden-ozel-plajli-denize-yurume-mesafes-bahceli-bakimli-1119947050/detay">
          <div class="btn-row">
            <button class="btn primary" id="goBtn" onclick="navigateToUrl()">Go</button>
            <button class="btn" id="parseBtn" onclick="parsePage()" disabled>Parse</button>
          </div>
        </div>
        <div id="batchTab" style="display:none">
          <textarea class="url-input" id="batchInput" placeholder="Paste URLs, one per line..."></textarea>
          <div class="btn-row">
            <button class="btn primary" id="batchBtn" onclick="startBatch()">Run Batch</button>
            <button class="btn" id="continueBatchBtn" onclick="continueBatch()" style="display:none">
              Continue Batch
            </button>
          </div>
        </div>
      </div>

      <div class="sidebar-section" style="flex-shrink: 0;">
        <h3>Proxy</h3>
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
          <div class="status-dot" id="proxyDot"></div>
          <span style="font-size:12px; color:var(--text-muted)" id="proxyLabel">Checking...</span>
        </div>
        <button class="btn" onclick="checkIP()" style="width:100%; font-size:12px;">
          🌐 Check Outbound IP
        </button>
      </div>

      <div class="sidebar-section" style="flex-shrink: 0;">
        <h3>Results <span class="count-badge" id="countBadge">0</span></h3>
      </div>

      <div class="results-area" id="resultsList">
        <div class="empty-state">No listings scraped yet.<br>Enter a URL and click Go.</div>
      </div>

      <div class="results-actions">
        <button class="btn" onclick="downloadResults()" style="flex:1">⬇ Download JSON</button>
        <button class="btn" onclick="clearResults()" style="flex:0 0 auto; color: var(--red)">Clear</button>
      </div>
    </div>

    <!-- ── Browser viewport ──────────────────────────────── -->
    <div class="viewport-area">
      <div class="viewport-toolbar">
        <div class="status-dot" id="statusDot"></div>
        <div class="url-display" id="currentUrl">—</div>
        <span id="fpsCounter">0 fps</span>
      </div>

      <div class="viewport-container" id="viewportContainer">
        <div class="viewport-placeholder" id="placeholder">
          <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <path d="M8 21h8M12 17v4" />
          </svg>
          <span>Enter a URL to start browsing</span>
        </div>
        <canvas id="browserCanvas" style="display:none"></canvas>
      </div>

      <div class="statusbar">
        <div class="msg" id="statusMsg">Ready</div>
      </div>
    </div>
  </div>

  <!-- ── Detail Modal ──────────────────────────────────────── -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────
    let ws = null;
    let results = [];
    let canvasReady = false;
    let frameCount = 0;
    let lastFpsTime = Date.now();

    const canvas = document.getElementById('browserCanvas');
    const ctx = canvas.getContext('2d');

    // ── WebSocket ──────────────────────────────────────────────
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/browser`);

      ws.onopen = () => {
        setStatus('connected', 'Connected to browser engine');
        document.getElementById('parseBtn').disabled = false;
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);

        if (msg.type === 'screenshot') {
          renderFrame(msg.data);
          document.getElementById('currentUrl').textContent = msg.url || '—';
          frameCount++;
        }
        else if (msg.type === 'status') {
          setStatus('connected', msg.message);
        }
        else if (msg.type === 'captcha_detected') {
          setStatus('captcha', msg.message);
          document.getElementById('continueBatchBtn').style.display = 'block';
        }
        else if (msg.type === 'parsed') {
          results.push(msg.data);
          renderResults();
          setStatus('ok', `Parsed! Total: ${msg.total} listing(s)`);
        }
        else if (msg.type === 'batch_complete') {
          setStatus('ok', msg.message);
          document.getElementById('continueBatchBtn').style.display = 'none';
        }
      };

      ws.onclose = () => setStatus('', 'Disconnected — refreshing...');
      ws.onerror = () => setStatus('', 'Connection error');
    }

    // ── Rendering ──────────────────────────────────────────────
    function renderFrame(b64) {
      const img = new Image();
      img.onload = () => {
        if (!canvasReady) {
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.style.display = 'block';
          document.getElementById('placeholder').style.display = 'none';
          canvasReady = true;
        }
        ctx.drawImage(img, 0, 0);
      };
      img.src = 'data:image/jpeg;base64,' + b64;
    }

    // FPS counter
    setInterval(() => {
      const now = Date.now();
      const fps = Math.round(frameCount / ((now - lastFpsTime) / 1000));
      document.getElementById('fpsCounter').textContent = fps + ' fps';
      frameCount = 0;
      lastFpsTime = now;
    }, 2000);

    // ── Canvas interaction ─────────────────────────────────────
    // Helper: get scaled coordinates
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: Math.round((e.clientX - rect.left) * scaleX),
        y: Math.round((e.clientY - rect.top) * scaleY),
      };
    }

    let isMouseDown = false;
    let mouseDownTime = 0;

    // Press-and-hold: mousedown → server holds mouse down
    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      isMouseDown = true;
      mouseDownTime = Date.now();
      ws?.send(JSON.stringify({ action: 'mousedown', x, y }));
    });

    // Release: mouseup → server releases mouse
    canvas.addEventListener('mouseup', (e) => {
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      const holdDuration = Date.now() - mouseDownTime;
      isMouseDown = false;

      // If it was a very short press (<200ms), send as click for normal links
      if (holdDuration < 200) {
        ws?.send(JSON.stringify({ action: 'mouseup', x, y }));
        ws?.send(JSON.stringify({ action: 'click', x, y }));
      } else {
        ws?.send(JSON.stringify({ action: 'mouseup', x, y }));
      }
    });

    // Track mouse movement (throttled) — important for challenge validation
    let lastMoveTime = 0;
    canvas.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastMoveTime < 50) return; // throttle to ~20 events/sec
      lastMoveTime = now;
      const { x, y } = getCanvasCoords(e);
      ws?.send(JSON.stringify({ action: 'mousemove', x, y }));
    });

    // Prevent context menu on right-click
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      ws?.send(JSON.stringify({ action: 'scroll', deltaY: e.deltaY }));
    }, { passive: false });

    // Keyboard forwarding when canvas is focused
    document.addEventListener('keydown', (e) => {
      if (document.activeElement?.tagName === 'INPUT' ||
        document.activeElement?.tagName === 'TEXTAREA') return;

      if (e.key.length === 1) {
        ws?.send(JSON.stringify({ action: 'type', text: e.key }));
      } else {
        ws?.send(JSON.stringify({ action: 'keypress', key: e.key }));
      }
    });

    // ── Actions ────────────────────────────────────────────────
    function navigateToUrl() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      ws?.send(JSON.stringify({ action: 'navigate', url }));
    }

    function parsePage() {
      ws?.send(JSON.stringify({ action: 'parse' }));
    }

    function startBatch() {
      const text = document.getElementById('batchInput').value.trim();
      const urls = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
      if (!urls.length) return;
      ws?.send(JSON.stringify({ action: 'batch', urls }));
    }

    function continueBatch() {
      ws?.send(JSON.stringify({ action: 'continue_batch' }));
      document.getElementById('continueBatchBtn').style.display = 'none';
    }

    // ── Tabs ───────────────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.getElementById('singleTab').style.display = tab === 'single' ? 'block' : 'none';
      document.getElementById('batchTab').style.display = tab === 'batch' ? 'block' : 'none';
    }

    // ── Results rendering ──────────────────────────────────────
    function renderResults() {
      const el = document.getElementById('resultsList');
      document.getElementById('countBadge').textContent = results.length;

      if (!results.length) {
        el.innerHTML = '<div class="empty-state">No listings scraped yet.</div>';
        return;
      }

      el.innerHTML = results.map((r, i) => `
    <div class="result-card" onclick="showDetail(${i})">
      <div class="rc-title">${esc(r.title || 'Untitled')}</div>
      <div class="rc-meta">${esc(r.location || '—')} · ID ${esc(r.listing_id || '—')}</div>
      <div class="rc-price">${esc(r.price || '—')}</div>
    </div>
  `).join('');
    }

    function showDetail(index) {
      const r = results[index];
      const detailRows = Object.entries(r.details || {})
        .map(([k, v]) => `<div class="label">${esc(k)}</div><div>${esc(v)}</div>`)
        .join('');

      const imagesHtml = (r.images || []).slice(0, 10)
        .map(src => `<img src="${esc(src)}" onerror="this.style.display='none'">`)
        .join('');

      document.getElementById('modalContent').innerHTML = `
    <h2>${esc(r.title || 'Untitled')}</h2>
    ${imagesHtml ? `<div class="images-row">${imagesHtml}</div>` : ''}
    <div class="detail-grid">
      <div class="label">Fiyat</div><div style="color:var(--green);font-weight:600">${esc(r.price || '—')}</div>
      <div class="label">Konum</div><div>${esc(r.location || '—')}</div>
      <div class="label">İlan No</div><div>${esc(r.listing_id || '—')}</div>
      <div class="label">İlan Tarihi</div><div>${esc(r.listing_date || '—')}</div>
      ${r.seller?.name ? `<div class="label">Satıcı</div><div>${esc(r.seller.name)}</div>` : ''}
      ${detailRows}
    </div>
    ${r.description ? `<div class="desc">${esc(r.description)}</div>` : ''}
    <div class="btn-row" style="margin-top:16px">
      <a class="btn" href="${esc(r.url)}" target="_blank" style="text-align:center;text-decoration:none">Open on Sahibinden</a>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>
  `;
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    async function downloadResults() {
      const blob = new Blob([JSON.stringify(results, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `sahibinden_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    async function clearResults() {
      if (!confirm('Clear all results?')) return;
      results = [];
      renderResults();
      await fetch('/api/results/clear', { method: 'POST' });
    }

    // ── Status ─────────────────────────────────────────────────
    function setStatus(type, msg) {
      const dot = document.getElementById('statusDot');
      const el = document.getElementById('statusMsg');
      dot.className = 'status-dot ' + (type || '');
      el.className = 'msg' + (type === 'captcha' ? ' warn' : type === 'ok' ? ' ok' : '');
      el.textContent = msg;
    }

    // ── Util ───────────────────────────────────────────────────
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s ?? '';
      return d.innerHTML;
    }

    // ── URL input: Enter key ───────────────────────────────────
    document.getElementById('urlInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigateToUrl();
    });

    // ── Proxy status ───────────────────────────────────────────
    async function fetchProxyStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const dot = document.getElementById('proxyDot');
        const label = document.getElementById('proxyLabel');
        if (data.proxy_configured) {
          dot.className = 'status-dot connected';
          label.textContent = `Active — ${data.proxy_server}`;
          label.style.color = 'var(--green)';
        } else {
          dot.className = 'status-dot';
          label.textContent = 'No proxy (using server IP)';
          label.style.color = 'var(--red)';
        }
      } catch {
        document.getElementById('proxyLabel').textContent = 'Status unavailable';
      }
    }

    function checkIP() {
      // Navigate the browser to an IP check service
      ws?.send(JSON.stringify({ action: 'navigate', url: 'https://api.ipify.org' }));
    }

    // ── Init ───────────────────────────────────────────────────
    connectWS();
    fetchProxyStatus();
  </script>
</body>

</html>
