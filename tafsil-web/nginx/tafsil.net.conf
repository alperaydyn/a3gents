# tafsil.net — Web App Reverse Proxy (Nginx)
# Dosya: /etc/nginx/sites-available/tafsil.net.conf
# Kurulum: sudo ln -sf /etc/nginx/sites-available/tafsil.net.conf /etc/nginx/sites-enabled/

upstream tafsil_web {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    server_name tafsil.net www.tafsil.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tafsil.net www.tafsil.net;

    # ─── SSL Sertifikaları (Cloudflare Origin CA / Multi-SAN) ───
    ssl_certificate /opt/tafsil/ssl/origin-cert.pem;
    ssl_certificate_key /opt/tafsil/ssl/origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Güvenlik Başlıkları ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Gzip Sıkıştırma ─────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        text/css
        text/plain
        image/svg+xml
        font/woff2;

    # ─── Next.js Statik Varlıklar (Immutable Cache) ──────
    location /_next/static/ {
        proxy_pass http://tafsil_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ─── Next.js Image Optimization ──────────────────────
    location /_next/image {
        proxy_pass http://tafsil_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ─── Open Graph Kart Üretici (Edge Runtime) ──────────
    location /api/og {
        proxy_pass http://tafsil_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache_valid 200 24h;
    }

    # ─── Tüm Sayfalar (SSR & Statik) ─────────────────────
    location / {
        proxy_pass http://tafsil_web;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR desteği
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
